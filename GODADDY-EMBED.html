<div id="lilmansions-dre-license" style="max-width:560px;margin:0 auto;padding:28px;border:1px solid #e6e6e6;border-radius:14px;background:#fff;font-family:Arial,sans-serif;text-align:left;box-sizing:border-box;">
  <div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:8px;">
    Professional Credentials
  </div>

  <div id="lm-name" style="font-size:24px;font-weight:700;line-height:1.25;margin-bottom:4px;">
    Robert P. Esparza
  </div>

  <div id="lm-type" style="font-size:15px;margin-bottom:18px;">
    California Real Estate Salesperson
  </div>

  <div style="font-size:15px;line-height:1.8;">
    <div><strong>DRE License #:</strong> <span id="lm-license-number">01890136</span></div>
    <div><strong>Status:</strong> <span id="lm-status">Checking...</span></div>
    <div><strong>Expiration:</strong> <span id="lm-expiration">Checking...</span></div>
  </div>

  <div id="lm-checked" style="font-size:12px;margin-top:14px;"></div>

  <a id="lm-dre-link"
     href="https://www2.dre.ca.gov/PublicASP/pplinfo.asp?License_id=01890136"
     target="_blank"
     rel="noopener noreferrer"
     style="display:inline-block;margin-top:18px;text-decoration:none;font-weight:700;">
    Verify License with California DRE →
  </a>
</div>

<script>
(function () {
  /*
    IMPORTANT:
    Replace YOUR-GITHUB-USERNAME below after GitHub Pages is enabled.
  */
  const LICENSE_JSON_URL =
    "https://elijahesparzaa.github.io/lilmansions-license-verification/license.json";

  const licenseNumber = document.getElementById("lm-license-number");
  const status = document.getElementById("lm-status");
  const expiration = document.getElementById("lm-expiration");
  const name = document.getElementById("lm-name");
  const type = document.getElementById("lm-type");
  const checked = document.getElementById("lm-checked");
  const dreLink = document.getElementById("lm-dre-link");

  fetch(LICENSE_JSON_URL + "?v=" + Date.now(), { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("License data unavailable");
      return response.json();
    })
    .then(function (data) {
      licenseNumber.textContent = data.licenseNumber || "01890136";
      name.textContent = data.name || "Robert P. Esparza";

      const rawType = (data.licenseType || "SALESPERSON").toUpperCase();
      type.textContent =
        rawType === "SALESPERSON"
          ? "California Real Estate Salesperson"
          : "California Real Estate " +
            rawType.charAt(0) + rawType.slice(1).toLowerCase();

      status.textContent = data.status || "See DRE record";
      expiration.textContent = data.expiration || "See DRE record";

      if (data.lastCheckedUtc) {
        const d = new Date(data.lastCheckedUtc);
        checked.textContent =
          "License data last checked: " +
          d.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
            timeZone: "America/Los_Angeles"
          });
      }

      if (data.officialVerificationUrl) {
        dreLink.href = data.officialVerificationUrl;
      }
    })
    .catch(function () {
      status.textContent = "See official DRE record";
      expiration.textContent = "See official DRE record";
      checked.textContent =
        "Live license data is temporarily unavailable. Please use the official DRE verification link.";
    });
})();
</script>
