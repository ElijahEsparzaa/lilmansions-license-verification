name: Update California DRE License

on:
  workflow_dispatch:
  schedule:
    # Run every day at 10:15 UTC.
    - cron: "15 10 * * *"

permissions:
  contents: write

jobs:
  update-license:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and process DRE license data
        run: python scripts/update_license.py

      - name: Commit updated license data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/license.json
          if git diff --cached --quiet; then
            echo "No license-data changes to commit."
          else
            git commit -m "Update DRE license data"
            git push
          fi
